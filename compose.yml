services:
  evaluation:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evaluation-data:/app/runtime
    restart: "no"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  evaluation-data:
