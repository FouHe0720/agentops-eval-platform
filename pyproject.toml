[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agentops-eval-platform"
version = "0.1.0"
description = "Offline-first, framework-neutral agent evaluation and trace analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<0.29", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
eval = "agentops_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
